<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Checkerboard - 10x7 (9x6 corners)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    canvas { display: block; border: 30px solid white; }
    #info { color: white; font-size: 14px; margin-top: 8px; font-family: monospace; }
  </style>
</head>
<body>
  <canvas id="cb"></canvas>
  <div id="info"></div>
  <script>
    const COLS = 8;   // 가로 칸 수 (내부 코너 7개)
    const ROWS = 8;   // 세로 칸 수 (내부 코너 7개)

    function draw() {
      const canvas = document.getElementById('cb');
      const maxW = window.innerWidth - 100;
      const maxH = window.innerHeight - 100;
      const sq = Math.min(Math.floor(maxW / COLS), Math.floor(maxH / ROWS));
      const W = sq * COLS;
      const H = sq * ROWS;
      canvas.width = W;
      canvas.height = H;

      const ctx = canvas.getContext('2d');
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? '#ffffff' : '#000000';
          ctx.fillRect(c * sq, r * sq, sq, sq);
        }
      }
      document.getElementById('info').textContent =
        `${COLS}x${ROWS} board (inner corners ${COLS-1}x${ROWS-1}) | square: ${sq}px`;
    }

    draw();
    window.addEventListener('resize', draw);
    document.addEventListener('keydown', e => {
      if (e.key === 'F11') { e.preventDefault(); document.documentElement.requestFullscreen(); }
    });
  </script>
</body>
</html>
